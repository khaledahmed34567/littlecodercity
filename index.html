game({id:'paint',lv:false,world:'mouse',title:'لوحة الرسم',ic:'palette',desc:'ارسم وأبدع بالألوان والأختام',th:[10,30,60],ctl:'none',
help:['اختار لون وحجم الفرشاة وارسم بالماوس أو بصباعك.','جرّب الأختام (نجمة، قلب، قطة…) وبعدين احفظ رسمتك!','كل ما ترسم أكتر بتكسب نجوم.'],
start(g){
 g.stage.innerHTML='<canvas id="cv" width="480" height="340" style="background:#fff;border:3px solid var(--key);cursor:crosshair"></canvas><div class="ptools" id="pt"></div>';
 const cv=$('#cv'),c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,480,340);c.lineCap='round';c.lineJoin='round';
 const COLS=['#2b2250','#e74c3c','#ff9f1a','#ffd93d','#22c55e','#3b82f6','#9b5de5','#ff6b9d'],STAMPS=['star','heart','cat','rocket','apple','sun'];
 let col=COLS[1],sz=8,stamp=null,eras=false,n=0,drawing=false,last=null;
 $('#pt').innerHTML='<div class="prow">'+COLS.map((k,i)=>'<button class="pc'+(i===1?' on':'')+'" data-c="'+k+'" style="background:'+k+'" aria-label="لون"></button>').join('')+'</div><div class="prow">'+[5,10,18].map((s,i)=>'<button class="ps'+(i===1?' on':'')+'" data-s="'+s+'"><i style="width:'+(s+4)+'px;height:'+(s+4)+'px"></i></button>').join('')+STAMPS.map(s=>'<button class="pst" data-st="'+s+'">'+ic(s)+'</button>').join('')+'<button class="pst" data-e="1" aria-label="ممحاة">'+ic('x')+'</button></div><div class="prow"><button class="big sm" id="pClr">'+ic('trash')+' مسح</button><button class="big sm" id="pSave">حفظ الرسمة</button><button class="big" id="pDone">'+ic('check')+' خلصت</button></div>';
 const mark=el=>{el.parentNode.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));el.classList.add('on')};
 $('#pt').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.c){col=b.dataset.c;eras=false;stamp=null;document.querySelectorAll('.pst.on').forEach(x=>x.classList.remove('on'));mark(b)}
  else if(b.dataset.s){sz=+b.dataset.s;mark(b)}
  else if(b.dataset.st){stamp=b.dataset.st;eras=false;document.querySelectorAll('.pst').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
  else if(b.dataset.e){eras=true;stamp=null;document.querySelectorAll('.pst').forEach(x=>x.classList.remove('on'));b.classList.add('on')}};
 const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*480/r.width,(e.clientY-r.top)*340/r.height]};
 const count=()=>{n++;g.report(n);g.hud('<span class="pill">'+ic('star')+' <b>'+n+'</b></span>')};
 cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);const p=pos(e);
  if(stamp){drawIc(c,stamp,p[0],p[1],64);sfx.pop();count();return}
  drawing=true;last=p;c.strokeStyle=eras?'#fff':col;c.lineWidth=eras?sz*2.4:sz;c.beginPath();c.moveTo(p[0],p[1]);c.lineTo(p[0]+.1,p[1]+.1);c.stroke()};
 cv.onpointermove=e=>{if(!drawing)return;const p=pos(e);c.beginPath();c.moveTo(last[0],last[1]);c.lineTo(p[0],p[1]);c.stroke();last=p};
 const up=()=>{if(drawing){drawing=false;count()}};cv.onpointerup=up;cv.onpointercancel=up;
 $('#pClr').onclick=()=>{c.fillStyle='#fff';c.fillRect(0,0,480,340);sfx.click()};
 $('#pSave').onclick=()=>{cv.toBlob(b=>{const a=el('a');a.href=URL.createObjectURL(b);a.download='رسمتي.png';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('اتحفظت رسمتك')})};
 $('#pDone').onclick=()=>g.finish({score:n,text:'رسمت <b>'+n+'</b> حركة جميلة!'});
 g.hud('<span class="pill">'+ic('star')+' <b>0</b></span>')}});

game({id:'race',world:'keys',title:'سباق الكتابة',ic:'car',desc:'اكتب بسرعة وسبق السيارة التانية',th:[1,2,3],ctl:'keys',
help:['اكتب الكلمات اللي بتظهر عشان سيارتك تجري.','كل حرف صح بيقدّمك خطوة. سبق السيارة التانية قبل ما توصل!'],
start(g){
 const ws=shuffle(WORDS).filter(w=>w[0].length<=g.T([4,4,5,5,6,6,7,7])).slice(0,g.T([6,7,8,8,9,9,10,10])),total=ws.reduce((a,w)=>a+w[0].length,0),bs=g.T([.8,1,1.25,1.5,1.8,2.1,2.4,2.8]);
 g.stage.innerHTML='<div class="lanes ltr"><div class="lane"><span class="car" id="c1">'+ic('car')+'</span><i class="fin"></i></div><div class="lane"><span class="car" id="c2">'+ic('bus')+'</span><i class="fin"></i></div></div><div class="pic" id="pic" style="font-size:64px"></div><div class="word" id="word"></div><div class="pill" id="ct"></div>';
 let wi=0,ci=0,p=0,b=0,mis=0,fin=false,idle=0;
 const place=()=>{const w=$('.lane').clientWidth-52;$('#c1').style.left=(p/total*w)+'px';$('#c2').style.left=(Math.min(b,total)/total*w)+'px'};
 const draw=()=>{const w=ws[wi][0];$('#pic').innerHTML=ic(ws[wi][1]);$('#word').innerHTML=[...w].map((ch,i)=>'<span class="lt'+(i===ci?' now':'')+'">'+(i<ci?ch:'')+'</span>').join('');$('#ct').textContent=(wi+1)+' / '+ws.length;g.noHint();clearTimeout(idle);idle=setTimeout(()=>{if(cur===g&&!g.over&&g.lv<3)g.hint(w[ci])},2500);g.timers.push(idle);place()};
 g.onKey=(t,e)=>{if(fin||g.over||t.length!==1||!/[a-z]/.test(t)||(e&&e.repeat))return;const w=ws[wi][0];
  if(t===w[ci]){sfx.ok();ci++;p++;if(ci===w.length){wi++;ci=0;if(wi>=ws.length){fin=true;place();const m=1-b/total;burst();g.finish({stars:m>.4?3:m>.15?2:1,score:Math.round(m*100),text:'كسبت السباق!'});return}}draw()}
  else{mis++;sfx.bad();g.hint(w[ci]);const l=$('#word').children[ci];if(l){l.classList.remove('bad');void l.offsetWidth;l.classList.add('bad')}}};
 g.raf(dt=>{if(fin)return;b+=bs*dt;place();if(b>=total){fin=true;g.finish({stars:0,score:0,text:'السيارة التانية سبقتك! جرّب تاني'})}});
 draw()}});

function parseItems(type,items){return items||[]}
function customGame(def){
 const nl=Math.max(1,Math.min(8,(def.levels||[]).length));
 const d={id:'c_'+def.id,custom:true,world:def.world||'code',title:def.title,ic:ICONS[def.ic]?def.ic:'puzzle',desc:def.desc||'لعبة جديدة',th:[1,2,3],maxLv:nl,video:def.video||'',order:def.order,
  help:def.help&&def.help.length?def.help:[{quiz:'اختار الإجابة الصح.',typing:'اكتب الكلمات اللي قدامك بالكيبورد.',order:'رتّب الخطوات بالترتيب الصح.',memory:'لاقي الأزواج المتشابهة.'}[def.type]||'استمتع باللعب!'],
  ctl:def.type==='typing'?'keys':'none'};
 if(nl<2)d.lv=false;
 d.start=g=>{const L=def.levels[Math.min(g.lv,nl)-1]||def.levels[0],it=L.items||[];
  if(def.type==='quiz')quizEngine(g,shuffle(it).slice(0,10).map(q=>({scene:q.img&&ICONS[q.img]?ic(q.img):'',rule:'<b>'+escH(q.q)+'</b>',opts:q.opts.map(o=>sideHtml(o)),a:q.a})));
  else if(def.type==='typing')typeEngine(g,shuffle(it).slice(0,8).map(x=>({w:String(x.w).toLowerCase().replace(/[^a-z ]/g,'').trim(),img:x.img})).filter(x=>x.w));
  else if(def.type==='order')stepsEngine(g,shuffle(it).slice(0,3));
  else if(def.type==='memory'){const ps=shuffle(it).slice(0,10);memoryEngine(g,ps,ps.length<=6?4:ps.length<=8?4:5)}
  else g.finish({stars:0,text:'نوع اللعبة مش معروف'})};
 return d}
let CONFIG={};
