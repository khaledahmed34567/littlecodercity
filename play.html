نات التي يقدّمها ولي الأمر صحيحة وكاملة ومحدَّثة.","• يجوز اللعب بوضع «بدون حساب» على الجهاز نفسه، وفي هذه الحالة يُحفظ التقدّم على الجهاز فقط."]],["4. الحساب والأمان",["• ولي الأمر مسؤول عن سرّية بريده وكلمة مروره والكود السري، وعن كل نشاط يتم عبر حسابه.","• يجب إبلاغنا فوراً إذا اشتبهت في دخول غير مصرّح به.","• الكود السري (PIN) يمنع الطفل من تغيير الإعدادات أو الخروج من وضع الطفل أو تجاوز وقت اللعب، ويُطلب أيضاً لفتح تطبيق متابعة الطفل.","• من حقنا تعليق الحساب مؤقتاً لحمايته إذا ظهر نشاط مشبوه."]],["5. مسؤولية ولي الأمر",["• الإشراف على استخدام الطفل للتطبيق وتحديد أوقات اللعب المناسبة.","• اختيار اسم مستعار للطفل لا يكشف اسمه الحقيقي أو مدرسته أو عنوانه.","• عدم مشاركة بيانات الدخول مع الطفل أو مع الغير.","• مراجعة سياسة الخصوصية وسياسة حماية الطفل والموافقة عليهما بوصفه صاحب الصلاحية على بيانات الطفل."]],["6. الاستخدام المقبول",["يلتزم المستخدم بما يلي، ويُمنع:","• محاولة اختراق التطبيق أو قاعدة بياناته أو تجاوز إجراءات الحماية أو فحص الثغرات دون إذن مكتوب.","• نسخ الكود أو الأيقونات أو المحتوى أو إعادة بيعه أو نشره دون إذن.","• استخدام برامج آلية للتلاعب بالنجوم أو النتائج.","• إدخال معلومات مسيئة أو مضللة أو تخص غيرك في أي حقل (مثل الاسم المستعار).","• استخدام التطبيق لأي غرض مخالف للقانون."]],["7. المحتوى التعليمي وحدود الضمان",["• التطبيق وسيلة تعليمية ترفيهية، ولا يُعدّ بديلاً عن التعليم المدرسي أو الإشراف التربوي.","• النجوم والمستويات والألقاب مؤشرات تحفيزية فقط، وليست تقييماً أكاديمياً رسمياً.","• نبذل جهدنا لجودة المحتوى وخلوّه من الأخطاء، لكننا لا نضمن خلوّه التام منها."]],["8. الملكية الفكرية",["• جميع الحقوق في التطبيق (الكود والتصميم والأيقونات والشخصية «كودو» والنصوص والألعاب) محفوظة لـ{owner}، ولا يجوز نسخها أو إعادة نشرها دون إذن كتابي.","• نمنحك ترخيصاً محدوداً وغير حصري وغير قابل للتحويل لاستخدام التطبيق لأغراض شخصية وتعليمية غير تجارية.","• الخطوط المستخدمة تخضع لتراخيص أصحابها."]],["9. التوفّر والتحديثات والمحتوى",["• تضيف الإدارة من وقت لآخر ألعاباً ومستويات ومقاطع فيديو شرح لطريقة اللعب، ويحق لها تعديلها أو إيقافها.","• قد يتوقف التطبيق أو بعض خصائصه مؤقتاً للصيانة أو لظروف خارجة عن إرادتنا.","• قد نضيف ألعاباً أو نعدّل مستويات أو نزيل ميزات، وسنعلن التغييرات الجوهرية داخل التطبيق.","• ميزات المزامنة والمتابعة تحتاج اتصالاً بالإنترنت، أما اللعب نفسه فيعمل دون اتصال."]],["10. حدود المسؤولية",["• يُقدَّم التطبيق «كما هو» دون ضمانات صريحة أو ضمنية بقدر ما يسمح به القانون.","• لا نتحمّل مسؤولية أي ضرر غير مباشر أو فقدان بيانات ناتج عن عطل الجهاز أو الإنترنت أو عن مشاركة ولي الأمر بيانات دخوله.","• لا يحدّ هذا البند من مسؤوليتنا في الحالات التي لا يجيز القانون الإعفاء منها."]],["11. إيقاف الحساب وحذفه",["• يحق لولي الأمر حذف ملف طفل أو حذف الحساب بالكامل في أي وقت من تطبيق ولي الأمر، وسيتم حذف البيانات المرتبطة به.","• يحق لنا إيقاف أي حساب يخالف هذه الشروط، مع إخطار ولي الأمر متى أمكن."]],["12. التغييرات على الشروط",["قد نحدّث هذه الشروط من وقت لآخر. عند وجود تغيير جوهري سنطلب موافقة ولي الأمر من جديد قبل متابعة الاستخدام. استمرار الاستخدام بعد الإخطار يعني الموافقة على النسخة المحدّثة."]],["13. القانون الواجب التطبيق",["تخضع هذه الشروط لقوانين جمهورية مصر العربية، وتختص محاكمها بالنظر في أي نزاع، مع عدم الإخلال بحقوق المستهلك وحقوق حماية الطفل المقررة بقوانين بلد إقامتك."]],["14. التواصل",["لأي استفسار أو شكوى: {email}"]]]},privacy:{t:"سياسة الخصوصية",ic:"lock",s:[["1. مقدّمة",["نحن في {publisher} نحترم خصوصية الأطفال وأولياء الأمور. توضّح هذه السياسة أي بيانات نجمعها، ولماذا، وكيف نحميها، وما حقوقك. وهي مكتوبة بما يتوافق مع قانون حماية البيانات الشخصية المصري رقم 151 لسنة 2020، ومع مبادئ قانون حماية خصوصية الأطفال على الإنترنت الأمريكي (COPPA) واللائحة الأوروبية العامة لحماية البيانات (GDPR) بخصوص بيانات الأطفال."]],["2. الجهة المسؤولة عن البيانات",["{publisher} — للتواصل: {email}"]],["3. البيانات التي نجمعها من ولي الأمر",["• الاسم (كما يكتبه ولي الأمر) والبريد الإلكتروني ورقم الهاتف (لتأمين الحساب والتواصل مع ولي الأمر عند الحاجة، ولا يظهر للأطفال).","• معرّف الحساب (UID) الذي ينشئه نظام تسجيل الدخول. كلمة المرور لا نراها ولا نخزّنها نصاً، وتُدار عبر خدمة تسجيل الدخول الآمنة.","• بصمة مشفّرة (Hash) للكود السري (PIN)، وليس الكود نفسه.","• سجل الموافقات: نوع الموافقة، رقم نسخة الشروط، وتاريخ ووقت الموافقة."]],["4. البيانات التي نجمعها عن الطفل (الحد الأدنى فقط)",["• اسم مستعار (يُنصح ألا يكون الاسم الحقيقي).","• سنة الميلاد فقط (لتحديد الفئة العمرية).","• الشخصية (الأيقونة) المختارة.","• بيانات اللعب: النجوم والمستويات والنتائج وتقدّم المراحل وعدد أيام اللعب المتتالية.","• سجل نشاط مختصر: اسم اللعبة، المستوى، النتيجة، مدة اللعب، والتاريخ.","• مدة اللعب اليومية وحدّ الوقت الذي يضعه ولي الأمر."]],["5. بيانات لا نجمعها إطلاقاً",["• الاسم الكامل للطفل أو صورته أو صوته أو فيديو له.","• الموقع الجغرافي أو العنوان أو اسم المدرسة.","• جهات الاتصال أو الرسائل أو الميكروفون أو الكاميرا.","• معرّفات الإعلانات أو بيانات التتبع لأغراض تسويقية.","• لا توجد دردشة ولا تعليقات ولا ميزات تواصل بين الأطفال أو مع الغرباء.","• لا توجد عمليات شراء داخل التطبيق ولا إعلانات."]],["6. أغراض استخدام البيانات",["• تشغيل الحساب وحفظ تقدّم الطفل ومزامنته بين الأجهزة.","• عرض تقارير المتابعة لولي الأمر في تطبيق ولي الأمر.","• تطبيق حدود وقت اللعب التي يحدّدها ولي الأمر.","• تحسين الألعاب والمستويات اعتماداً على إحصاءات مجمّعة لا تحدّد هوية الطفل.","• حماية الحسابات ومنع إساءة الاستخدام.","لا نستخدم بيانات الأطفال في الإعلانات أو بناء ملفات تسويقية، ولا نبيعها ولا نؤجّرها."]],["7. الأساس القانوني: موافقة ولي الأمر",["نعالج بيانات الطفل بناءً على موافقة صريحة ومسبقة من ولي أمره عند إنشاء الحساب، ويمكنه سحبها في أي وقت بحذف ملف الطفل أو الحساب. لا نجمع بيانات أي طفل قبل هذه الموافقة (باستثناء وضع «بدون حساب» الذي يبقى على الجهاز فقط)."]],["8. مشاركة البيانات",["لا نشارك البيانات إلا مع مزوّدي خدمات يعالجونها نيابةً عنا وبما يلزم لتشغيل التطبيق فقط:","• Google Firebase (تسجيل الدخول وقاعدة البيانات والاستضافة)، وهم ملتزمون باتفاقيات معالجة بيانات.","• جهات رسمية إذا ألزمنا القانون بذلك بطلب قانوني صحيح.","لا نشارك أي بيانات مع معلنين أو وسطاء بيانات أو شبكات تواصل."]],["9. نقل البيانات خارج بلدك",["قد تُخزَّن البيانات على خوادم في دول أخرى يوفرها مزوّد الخدمة السحابية. نتخذ الضمانات التعاقدية والتقنية المناسبة لحماية البيانات أثناء النقل والتخزين."]],["10. مدة الاحتفاظ بالبيانات",["• بيانات الحساب والأطفال: طوال مدة بقاء الحساب نشطاً.","• عند حذف ملف طفل أو الحساب: تُحذف البيانات المرتبطة به من قاعدة البيانات الحيّة فوراً تقريباً، ومن النسخ الاحتياطية خلال مدة أقصاها 30 يوماً.","• الحسابات غير النشطة لأكثر من 24 شهراً قد تُحذف بعد إشعار ولي الأمر.","• سجل الموافقات قد نحتفظ به المدة التي يلزمها القانون لإثبات الموافقة."]],["11. أمان البيانات",["• تشفير الاتصال (HTTPS/TLS) أثناء نقل البيانات.","• قواعد وصول تمنع أي حساب من قراءة بيانات حساب آخر، وتمنع تعديل محتوى الألعاب إلا للإدارة.","• كود سري (PIN) لحماية إعدادات ولي الأمر داخل نسخة الطفل وتطبيق المتابعة.","• تقليل البيانات المخزّنة إلى الحد الأدنى اللازم.","• لا يوجد نظام آمن بنسبة 100%، ونلتزم بإبلاغ ولي الأمر والجهات المختصة عند وقوع اختراق يؤثر على بياناته وفق القانون."]],["12. حقوق ولي الأمر والطفل",["يحق لولي الأمر، نيابةً عن الطفل ولنفسه:","• الاطلاع على البيانات المحفوظة (من تطبيق ولي الأمر).","• تصحيح البيانات (الاسم المستعار، سنة الميلاد، الشخصية).","• تصدير نسخة من البيانات بصيغة JSON.","• حذف ملف الطفل أو الحساب بالكامل.","• سحب الموافقة أو الاعتراض على المعالجة في أي وقت.","• تقديم شكوى إلى الجهة المختصة بحماية البيانات الشخصية في بلده.","لممارسة أي حق عبر البريد: {email} وسنردّ خلال 30 يوماً."]],["13. التخزين المحلي (Local Storage) والكوكيز",["يستخدم التطبيق التخزين المحلي في جهازك لحفظ التقدّم وإعدادات الصوت والمظهر وحالة الدخول. لا نستخدم كوكيز إعلانية ولا أدوات تحليل تتبّع الأفراد."]],["14. خدمات وموارد خارجية",["• تسجيل الدخول بجوجل اختياري لولي الأمر فقط، ولا يظهر للطفل.","• قد تُحمَّل الخطوط من خادم خارجي إذا لم تكن محفوظة داخل التطبيق، وفي هذه الحالة قد يرى ذلك الخادم عنوان الاتصال (IP) فقط.","• لا توجد روابط خارجية يمكن للطفل الوصول إليها من داخل التطبيق."]],["15. خصوصية الأطفال",["• لا نطلب من الطفل أي معلومة شخصية تتجاوز الاسم المستعار وسنة الميلاد.","• إذا علمنا أننا جمعنا بيانات طفل دون موافقة ولي أمره فسنحذفها دون تأخير.","• وصول ولي الأمر لبيانات طفله يتم دائماً عبر حسابه المحمي."]],["16. تغيير هذه السياسة",["قد نحدّث السياسة، وسنعلمك داخل التطبيق بالتغييرات الجوهرية ونطلب موافقتك من جديد عند الحاجة. تاريخ آخر تحديث: {version}."]],["17. التواصل",["أسئلة الخصوصية والشكاوى: {email}"]]]},child:{t:"سياسة حماية الطفل",ic:"shield",s:[["1. التزامنا",["مصلحة الطفل الفضلى هي الأساس في كل قرار تصميم. نلتزم بتوفير بيئة لعب وتعلّم آمنة ومناسبة للعمر، بما يتوافق مع مبادئ قانون الطفل المصري رقم 12 لسنة 1996 وتعديلاته واتفاقية حقوق الطفل."]],["2. بيئة آمنة بالتصميم",["• لا دردشة، ولا رسائل، ولا تعليقات، ولا ملفات شخصية عامة، ولا تواصل بين الأطفال أو مع أي غريب.","• لا إعلانات ولا عمليات شراء داخل التطبيق ولا مكافآت مالية.","• لا توجد روابط خارجية في نسخة الطفل.","• لا يطلب التطبيق صوراً ولا موقعاً ولا ميكروفوناً ولا كاميرا.","• لا يوجد محتوى مستخدمين، فكل محتوى الألعاب أعدّه فريقنا."]],["3. ملاءمة المحتوى للعمر",["• جميع الألعاب تعليمية ومرحة (ماوس، كيبورد، منطق، برمجة) بلا عنف ولا ألفاظ سيئة ولا صور مخيفة.","• الصور كرتونية بسيطة وآمنة، والنصوص باللغة العربية الواضحة مع كلمات إنجليزية تعليمية بسيطة.","• مستويات الصعوبة تتدرج (سهل، متوسط، صعب) حتى لا يشعر الطفل بالإحباط."]],["4. الموافقة الأبوية الموثّقة",["• لا يُنشأ ملف لطفل إلا بعد إنشاء حساب ولي أمر بالغ والموافقة صراحةً على الشروط والخصوصية وهذه السياسة.","• نحتفظ بسجل موافقة يتضمن نوع الموافقة ونسخة النص وتاريخها.","• يستطيع ولي الأمر سحب الموافقة بحذف الملف أو الحساب في أي لحظة."]],["5. تقليل البيانات",["نجمع أقل قدر ممكن: اسم مستعار، سنة ميلاد، شخصية، وتقدّم اللعب. ننصح بشدة بعدم استخدام الاسم الكامل للطفل. التفاصيل الكاملة في سياسة الخصوصية."]],["6. بوابة ولي الأمر والكود السري",["• نسخة اللابتوب تمنع لقطات الشاشة وتسجيل الشاشة أثناء اللعب لحماية خصوصية الطفل.","• كل الإعدادات (تبديل الطفل، الحسابات، حدود الوقت، الخروج) محمية بكود سري من 4 أرقام يختاره ولي الأمر عند التسجيل، ويكتبه أيضاً لفتح تطبيق المتابعة.","• تسجيل الدخول والتسجيل وروابط الشروط للكبار فقط.","• ننصح بعدم استخدام تاريخ ميلاد الطفل أو أرقام سهلة (1234) كالكود السري."]],["7. أدوات ولي الأمر للمتابعة والتحكم",["• لوحة متابعة: النجوم، المستوى، الألعاب المفضلة، أيام اللعب، ومدة اللعب اليومية.","• سجل نشاط حديث لكل ملف.","• قفل ألعاب محددة لكل طفل وفتحها في أي وقت.","• تحديد حد يومي لوقت اللعب (من 10 دقائق إلى ساعتين أو بدون حد). عند انتهائه يتوقف اللعب ويحتاج تمديده لرمز PIN.","• إضافة أطفال متعددين وتعديل بياناتهم وحذفهم.","• تصدير البيانات وحذف الحساب نهائياً."]],["8. اللعب الصحي",["نشجّع على توازن صحي بين الشاشات والنشاط البدني والنوم. نوصي بما يلي:","• فاصل راحة كل 20 دقيقة تقريباً، والنظر لمسافة بعيدة 20 ثانية.","• الجلوس بوضعية سليمة وإضاءة مناسبة وشاشة على مسافة مريحة.","• عدم اللعب قبل النوم بساعة على الأقل.","• اللعب مع الطفل أحياناً ومناقشة ما تعلّمه."]],["9. إرشادات لولي الأمر للأمان الرقمي",["• اختر كلمة مرور قوية فريدة لحسابك ولا تشاركها.","• استخدم اسماً مستعاراً غير حقيقي للطفل.","• علّم طفلك ألا يشارك معلوماته الشخصية مع أي أحد على الإنترنت.","• أخبر طفلك أن يخبرك فوراً إذا رأى أي شيء يزعجه.","• حدّث نظام جهازك ومتصفحك باستمرار."]],["10. التزامات فريقنا",["• الوصول إلى بيانات الأطفال محصور في من يحتاجه فعلاً لتشغيل الخدمة أو الدعم الفني، ويلتزم بالسرية.","• لا نتواصل مع الأطفال مباشرةً بأي وسيلة.","• نراجع الألعاب والمحتوى قبل إضافتها لضمان ملاءمتها للأطفال."]],["11. الإبلاغ عن مشكلة أو مخاوف",["إذا لاحظت أي محتوى غير مناسب، أو مشكلة أمان، أو شككت في سوء استخدام بيانات طفل، راسلنا فوراً على {email} مع وصف المشكلة. نلتزم بالرد خلال 72 ساعة، والتعامل العاجل مع بلاغات سلامة الأطفال."]],["12. التعامل مع الحوادث",["عند حدوث اختراق أو تسريب يمس بيانات الأطفال: نوقف الخطر فوراً، نحقق في الأسباب، نبلغ أولياء الأمور المتأثرين والجهات المختصة وفق القانون، ونتخذ إجراءات لمنع التكرار."]],["13. حقوق الطفل",["• أن يلعب بأمان بعيداً عن الإعلانات والتواصل مع الغرباء.","• أن تُحترم خصوصيته وأن يُحذف ملفه متى طلب ولي أمره.","• أن يتعلم بأسلوب ممتع بلا ضغط أو مقارنة قاسية بالآخرين (لا توجد لوحات ترتيب عامة بين الأطفال)."]],["14. مراجعة السياسة",["نراجع هذه السياسة دورياً ونحدّثها مع تطوّر التطبيق والقوانين. آخر تحديث: {version}."]]]}},Bs=t=>String(t).replace(/\{publisher\}/g,(window.APP_CONFIG||
